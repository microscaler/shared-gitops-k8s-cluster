[project]
name = "shared-gitops-tooling"
version = "0.1.0"
description = "msk8s — cluster tooling for shared-gitops-k8s-cluster (nodes, cloud-init, inventory)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
msk8s = "shared_gitops.cli:main"
validate-inventory = "shared_gitops.validate_inventory:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
