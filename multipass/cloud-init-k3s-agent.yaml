#cloud-config
# k3s worker base — same as server (agent install via justfile).

package_update: true
package_upgrade: false

packages:
  - curl
  - jq
  - open-iscsi
  - nfs-common

write_files:
  - path: /etc/rancher/k3s/registries.yaml
    permissions: "0644"
    content: |
      mirrors:
        "{{REGISTRY_HOST_ALIAS}}":
          endpoint:
            - "http://{{REGISTRY_LB_IP}}:5000"
        "registry.shared-k8s.local:5000":
          endpoint:
            - "http://{{REGISTRY_LB_IP}}:5000"
        "registry.registry.svc.cluster.local:5000":
          endpoint:
            - "http://{{REGISTRY_LB_IP}}:5000"
        # The direct reference form ("<lb-ip>:5000/image") used by dev image
        # tags MUST have its own mirror entry — insecure_skip_verify alone
        # does not downgrade HTTPS->HTTP. Missing this bricked k8s-worker-4
        # (ErrImagePull "HTTP response to HTTPS client", 2026-08-28).
        "{{REGISTRY_LB_IP}}:5000":
          endpoint:
            - "http://{{REGISTRY_LB_IP}}:5000"
      configs:
        "{{REGISTRY_LB_IP}}:5000":
          tls:
            insecure_skip_verify: true

runcmd:
  - modprobe br_netfilter
  - echo br_netfilter > /etc/modules-load.d/br_netfilter.conf
  - sysctl -w net.ipv4.ip_forward=1
