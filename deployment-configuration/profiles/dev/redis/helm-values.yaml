# Dev overlay for Bitnami Redis (Flux valuesFrom).
global:
  security:
    allowInsecureImages: true

architecture: standalone

image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: 7.4.2-debian-12-r0

auth:
  enabled: false

# maxmemory MUST stay below the container limit below (256Mi). Without it
# Redis grows unbounded and the kernel OOM-kills the pod, taking the whole
# instance down - sesame-idam refresh tokens and hauliage state included -
# with no warning and no graceful degradation. With it, Redis reaches its own
# ceiling first and reports OOM on writes: a failure you can see and alert on
# rather than a restart you have to infer.
#
# noeviction is deliberate HERE: this instance holds auth and session state,
# and silently dropping a refresh token is worse than refusing a write.
# Cache-shaped, growth-prone data belongs on its own instance where an LRU
# policy is safe - Redis eviction is instance-wide and cannot be told to
# prefer one tenant over another.
commonConfiguration: |-
  appendonly yes
  save ""
  maxmemory 200mb
  maxmemory-policy noeviction

master:
  disableCommands: []
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 200m
  persistence:
    enabled: true
    existingClaim: redis-storage
    path: /data
  service:
    type: ClusterIP
    ports:
      redis: 6379

volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r51

metrics:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis-exporter
    tag: 1.67.0-debian-12-r0
  resources:
    requests:
      memory: 32Mi
      cpu: 25m
    limits:
      memory: 128Mi
      cpu: 100m
  service:
    type: ClusterIP
    ports:
      http: 9121
