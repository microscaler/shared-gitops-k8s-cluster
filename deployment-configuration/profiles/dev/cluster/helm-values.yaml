# Dev overlay for twuni/docker-registry (Flux valuesFrom).
# Existing PVC + no chart securityContext (raw deploy ran as default/root).
# MetalLB Service `registry` is Flux-owned (service-registry.yaml), not this chart.
image:
  repository: registry
  tag: "3"
  pullPolicy: IfNotPresent

replicaCount: 1

# RWO PVC (iSCSI): RollingUpdate deadlocks every restart — the new pod
# Multi-Attach-fails while the old one holds the volume (observed
# 2026-07-24). Recreate stops the old pod first; brief registry blip is
# acceptable for a dev registry.
updateStrategy:
  type: Recreate

persistence:
  enabled: true
  existingClaim: registry-data
  deleteEnabled: true

storage: filesystem

service:
  type: ClusterIP

# Match prior raw Deployment — do not force uid 1000 on existing ZFS data.
securityContext:
  enabled: false
containerSecurityContext:
  enabled: false

# Tag prune stays in registry-housekeeping.yaml; chart GC optional later.
garbageCollect:
  enabled: false

resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m
