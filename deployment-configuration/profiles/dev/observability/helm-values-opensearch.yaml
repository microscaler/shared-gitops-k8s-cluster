# Dev overlay for OpenSearch chart (Flux valuesFrom).
clusterName: opensearch
nodeGroup: nodes
singleNode: true
replicas: 1

securityConfig:
  enabled: false
extraEnvs:
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"

config:
  opensearch.yml: |
    cluster.name: opensearch
    network.host: 0.0.0.0
    discovery.type: single-node
    plugins.security.disabled: true

# Heap ≈ 50% of cgroup. With workers freed (CI runners stopped) + worker-4,
# give OpenSearch real Lucene/off-heap headroom so observability stays up.
opensearchJavaOpts: "-Xmx4g -Xms4g"

resources:
  requests:
    cpu: "1"
    memory: 6Gi
  limits:
    cpu: "4"
    memory: 8Gi

persistence:
  enabled: true
  enableInitChown: true
  storageClass: zfs-iscsi
  # volumeClaimTemplates are immutable — expand the live PVC out-of-band
  # (kubectl patch) when growing disk; keep this at the original claim size.
  size: 30Gi
  accessModes:
    - ReadWriteOnce

sysctlInit:
  enabled: true

antiAffinity: soft

service:
  type: ClusterIP
  annotations: {}
