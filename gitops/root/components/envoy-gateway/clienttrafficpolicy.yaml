# Trust the LAN proxy's X-Forwarded-For so Envoy knows who the client is.
#
# Topology: browser --443--> haproxy (TLS terminate) --80--> Envoy --> Service.
# Envoy's connection peer is therefore always haproxy, never the user. Left
# uncorrected that breaks two things:
#
#   1. Any rate limit keyed on client IP degrades into a single shared bucket.
#      One noisy client would exhaust it and lock out everybody — a limit that
#      converts a nuisance into an outage is worse than no limit at all.
#   2. Access logs and audit trails attribute every request to the proxy, so a
#      compromise cannot be traced back to a source.
#
# numTrustedHops: 1 means "strip one hop of XFF and treat the next address as
# the client" — correct for exactly one trusted proxy in front. It must match
# the real topology: too high and a client can spoof its own address by
# sending its own XFF header; too low and we key on the proxy again.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: trust-lan-proxy-xff
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: shared-gitops-k8s-cluster
    gitops.microscaler.io/stack: envoy-gateway
  annotations:
    gitops.microscaler.io/edge: "*.dev.microscaler.local"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: microscaler-dev
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
