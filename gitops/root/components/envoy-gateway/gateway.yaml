# Shared edge Gateway — HTTP(S) for *.dev + TCP/UDP L4 ports (GitOps).
# LAN: haproxy owns *.dev.microscaler.local (Tilt local; else → Envoy :80).
# L4: haproxy TCP → this VIP’s matching ports → TCPRoute/UDPRoute → Service.
#
# Two DNS zones terminate here now: the original *.dev.microscaler.local, and
# sesameidentity.dev.local (ADR-013 in sesame-idam) — the dev mirror of the one
# public domain, so cookie scoping and origin separation are exercised where
# people work rather than first observed in production.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: microscaler-dev
  namespace: envoy-gateway-system
  labels:
    app.kubernetes.io/part-of: shared-gitops-k8s-cluster
    gitops.microscaler.io/stack: envoy-gateway
  annotations:
    # Every hostname this Gateway will answer for. Kept exhaustive on purpose:
    # it is the only place a reader can see the edge's whole surface without
    # counting listeners.
    gitops.microscaler.io/edge: "*.dev.microscaler.local,*.sesameidentity.dev.local,sesameidentity.dev.local"
spec:
  gatewayClassName: microscaler-dev
  listeners:
    - name: http
      hostname: "*.dev.microscaler.local"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.dev.microscaler.local"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: dev-microscaler-local-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All

    # --- sesameidentity.dev.local (ADR-013 dev mirror of the public domain) ---
    #
    # FOUR listeners, not two, and that is the minimum rather than belt-and-braces.
    # A Gateway API listener carries exactly ONE hostname, and a wildcard matches
    # exactly one label: `*.sesameidentity.dev.local` covers `platform.`, `app.`,
    # `auth.` — but NOT the bare apex, which is where the brochure lives. Serving
    # only subdomains in dev was the other option and was rejected: it would leave
    # the apex 404ing, which is precisely the host a person types first, and dev
    # exists to mirror the shape (ADR-013 "Consequences").
    #
    # Both HTTPS listeners point at ONE Secret, so that cert must carry BOTH
    # `*.sesameidentity.dev.local` and `sesameidentity.dev.local` as SANs — a
    # wildcard alone does not cover its own apex.
    #
    # `from: All` matches the two listeners above: routes are owned by the product
    # repos (sesame-idam), not by this one.
    - name: sesameidentity-http
      hostname: "*.sesameidentity.dev.local"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: sesameidentity-https
      hostname: "*.sesameidentity.dev.local"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: sesameidentity-dev-local-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    - name: sesameidentity-apex-http
      hostname: "sesameidentity.dev.local"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: sesameidentity-apex-https
      hostname: "sesameidentity.dev.local"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: sesameidentity-dev-local-tls
            namespace: cert-manager
      allowedRoutes:
        namespaces:
          from: All
    # No listener is needed for `api.` or `id.` — the wildcard pair above already
    # covers those hostnames the moment something serves them. Neither has a
    # backend yet: the API edge is task 50, the issuer/BFF work is task 54.

    # --- L4 (lan-proxy forwards these ports to ENVOY_GATEWAY_LB_IP) ---
    - name: tcp-k8s-api
      port: 6443
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-postgres
      port: 5433
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-redis
      port: 6390
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-minio
      port: 9000
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-mailpit-smtp
      port: 1025
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-faktory
      port: 7419
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-otel-grpc
      port: 4317
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-otel-http
      port: 4318
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-registry
      port: 5001
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-squid
      port: 3128
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-fluvio-sc
      port: 9003
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    # Multipass guest / bridge L4 (former dedicated MetalLB VIPs)
    - name: tcp-routellm
      port: 4000
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: tcp-resurrection
      port: 14000
      protocol: TCP
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All
    - name: udp-radius-auth
      port: 1812
      protocol: UDP
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: All
    - name: udp-radius-acct
      port: 1813
      protocol: UDP
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: All
