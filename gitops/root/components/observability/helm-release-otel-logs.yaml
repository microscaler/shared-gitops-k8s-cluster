# Logs-agent DaemonSet (nginx SPA container stdout → Data Prepper).
# Gateway OTLP/metrics collector remains helm-release-otel.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector-logs
  namespace: observability
  labels:
    app.kubernetes.io/part-of: shared-gitops-k8s-cluster
    gitops.microscaler.io/stack: observability
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: data-prepper
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.110.7"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: observability
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: observability-helm-values
      valuesKey: otel-logs.yaml
