apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  # Zot OCI registry (2026-08-01): replaces twuni/docker-registry HelmRelease,
  # its GitRepository, the registry-data claim, and the registry-housekeeping
  # CronJob. Retention + GC are built into zot (see zot-registry.yaml).
  - zot-registry.yaml
  # LB must be Flux-owned (see service-registry.yaml) — selects app=registry pods.
  - service-registry.yaml
  - service-registry-cluster.yaml
  - local-registry-hosting.yaml
  - metallb/ipaddresspool.yaml
  - coredns-custom.yaml

# Migrated from shared-k8s-cluster/k8s/cluster (Phase 3).
# MetalLB operator itself remains Day-0; this manages the IPAddressPool + L2Advertisement.
