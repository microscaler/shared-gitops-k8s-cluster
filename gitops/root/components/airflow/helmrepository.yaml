# Official apache airflow helm chart (helm-chart/1.16.0), mirrored
# unmodified from https://airflow.apache.org into the in-cluster zot
# registry as an OCI artifact:
#   just airflow-chart-push
# (The casibbald/airflow chart fork is retired — it was cut from the
# v2-10-stable dev snapshot; all its patches are unnecessary vs the release.)
# Airgap-compatible: the cluster only ever pulls from zot (10.177.76.220:5000).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot-charts
  namespace: airflow
  labels:
    app.kubernetes.io/part-of: shared-gitops-k8s-cluster
    gitops.microscaler.io/stack: airflow
spec:
  interval: 24h
  type: oci
  url: oci://10.177.76.220:5000/charts
  insecure: true
