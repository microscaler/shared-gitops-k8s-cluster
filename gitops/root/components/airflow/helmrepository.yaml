# Airflow chart from the local casibbald/airflow fork clone
# (~/Workspace/remote/metro/airflow, branch 2.10.5-Beta1, chart 1.16.0-dev),
# packaged and pushed to the in-cluster zot registry as an OCI artifact:
#   just airflow-chart-push   (AIRFLOW_FORK_DIR overrides the clone path)
# Airgap-compatible: the cluster only ever pulls from zot (10.177.76.220:5000).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot-charts
  namespace: airflow
  labels:
    app.kubernetes.io/part-of: shared-gitops-k8s-cluster
    gitops.microscaler.io/stack: airflow
spec:
  interval: 24h
  type: oci
  url: oci://10.177.76.220:5000/charts
  insecure: true
